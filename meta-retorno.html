<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Conectando… · Plataforma Mays</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#2e2e2e;color:#fafafa;font:15px system-ui,sans-serif}</style>
</head>
<body>
<p>Conectando com a Meta…</p>
<script>
// Volta do "Conectar com Facebook" (Redes sociais › Configurar). Guarda o
// código só nesta aba e volta para a Plataforma, que conclui a conexão no
// servidor. O código vale uma vez e por poucos minutos; some da barra já.
(function () {
  var q = new URLSearchParams(location.search);
  try {
    sessionStorage.setItem('meta_oauth', JSON.stringify({
      code: q.get('code'), state: q.get('state'),
      error: q.get('error_description') || q.get('error') || null,
    }));
    localStorage.setItem('plat_modulo', 'redes');
  } catch (e) { /* sem armazenamento: a pessoa conecta de novo */ }
  location.replace('index.html');
})();
</script>
</body>
</html>
